[target.xtensa-esp32-none-elf]
runner = "espflash flash --baud 921600 --monitor --chip esp32"
# Scoped to the target rather than [build] so it doesn't leak into host
# builds -- `-nostartfiles` on the host produces a test binary with no
# entry point, which segfaults before main.
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

[env]
ESP_LOG="info"
# esp-hal 1.2 defaults the ESP32 minimum chip revision to v3.0 and bakes it
# into the ELF metadata; espflash 4.7+ refuses to flash an older chip and
# `esp_hal::init` asserts it at boot, so `--force` would only move the
# failure. The board in use is an ESP32 v1.0. With the floor at 0 esp-hal
# reads the revision from efuse at run time to pick its errata workarounds.
ESP_HAL_CONFIG_MIN_CHIP_REVISION="0"
# Place the RMT driver (receive start, reader, interrupt handler) in IRAM.
# The receiver is dead from the end of a capture until the loop re-arms
# it, and Nexus-TH leaves about 1.4 ms for that, so the driver code on
# that path should not stall on flash cache misses. The receive loop
# itself cannot be moved: `#[ram]` on an async fn only places the stub
# that builds the future, the body is a coroutine that stays in flash.
ESP_HAL_CONFIG_PLACE_RMT_DRIVER_IN_RAM="true"

# Run the decoder crate's unit tests on the host. Must be invoked as
# `cargo +stable test-decoder`: the `[unstable]` build-std below is
# nightly-only, and the stable toolchain ignores it, which is what lets
# the host target link against its own prebuilt std.
[alias]
test-decoder = "test -p decoder --target x86_64-unknown-linux-gnu"

[build]
target = "xtensa-esp32-none-elf"

[unstable]
build-std = ["alloc", "core"]
