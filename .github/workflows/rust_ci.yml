name: Continuous Integration

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SSID: testssid
  PASSWORD: testpassword
  MQTT_SERVER: mqtt.lan
  MQTT_LOGIN: testlogin
  MQTT_PASSWORD: testpassword
  MQTT_TOPIC: sensors

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release
          - command: fmt
            args: --all -- --check
          - command: clippy
            args: --all-features --workspace -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32
          ldproxy: false
          version: "1.92.0"
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

  decoder-tests:
    name: Decoder unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # The decoder crate is plain stable Rust with no hardware or nightly
      # dependency, so it's tested on stable rather than the esp toolchain.
      # That's also what makes it work: the stable toolchain ignores the
      # nightly-only `[unstable] build-std` in .cargo/config.toml, so the
      # host target links against its own prebuilt std.
      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run decoder tests on host
        run: cargo +stable test-decoder
