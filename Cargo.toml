[package]
edition      = "2024"
name         = "esp-rf-ook2"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "esp-rf-ook2"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "1.2.2", features = ["log-04", "esp32", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "log-04",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32", "log-04"] }

# `auto-icmp-echo-reply`: smoltcp only answers pings with it on, and it is
# off by default; the device is otherwise unreachable to a plain `ping`.
embassy-net = { version = "0.9.1", features = [
  "auto-icmp-echo-reply",
  "dhcpv4",
  "dhcpv4-hostname",
  "dns",
  "log",
  "medium-ethernet",
  "proto-ipv4",
  "tcp",
  "udp",
] }
esp-alloc = { version = "0.11.0", features = ["esp32"] }
# `custom-halt` routes a panic to `custom_halt` in src/lib.rs, which resets
# the chip at once instead of sitting halted until the watchdog fires.
esp-backtrace = { version = "0.20.0", features = [
  "custom-halt",
  "println",
  "esp32",
  "panic-handler",
] }
esp-println = { version = "0.18.0", features = ["esp32", "log-04", "timestamp"] }
embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.1" }
esp-radio = { version = "1.0.0-beta.1", features = [
  "log-04",
  "esp-alloc",
  "esp32",
  "unstable",
  "wifi",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
sntpc             = { version = "0.11.0", default-features = false }
sntpc-net-embassy = "0.11.0"
heapless = { version = "0.9" }
jiff = { version = "0.2.38", default-features = false, features = ["static", "alloc"] }
log = "0.4.29"
embassy-sync = { version = "0.8.0", features = ["log"] }
embassy-futures = { version = "0.1.2", features = ["log"] }
# `bump`: received packets are parsed into a caller-provided slice, so the
# MQTT client never touches the heap.
rust-mqtt = { version = "0.6.0", default-features = false, features = ["v5", "bump", "log", "log-level-warn"] }
decoder = { path = "decoder" }

[workspace]
members = ["decoder"]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

